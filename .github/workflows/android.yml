name: Build Zero-Error Android APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. गिटहब से आपका कोड और लोगो उठाना
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. जावा JDK 17 को एकदम सटीक सेटअप करना
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. नोड जेएस एनवायरनमेंट चालू करना
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Apache Cordova को इंस्टॉल करना
      - name: Install Apache Cordova
        run: npm install -g cordova
        # 5. नया प्रोजेक्ट बनाना, नाम और लोगो सेट करना
      - name: Create Cordova Project with Name and Icon Setup
        run: |
          cordova create billing-app com.kalpvruksha.billing "Kalpvruksha Billing"
          cd billing-app
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/index.html
          
          # लोगो (icon.png) को सही जगह सेट करने का पक्का लॉजिक
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi

      # 6. पहले कोर्डोवा से पूरी फाइल्स और gradlew को जबरदस्ती डाउनलोड करवाना (No such file का परमानेंट इलाज)
      - name: Prepare Cordova Android Platform Assets
        run: |
          cd billing-app
          cordova prepare android

      # 7. अब जब gradlew फाइल आ चुकी है, तो उसे ABSOLUTE FULL PERMISSION देना
      - name: Grant Absolute Permission for Generated Gradle
        run: |
          sudo chmod -R 777 billing-app
          cd billing-app/platforms/android
          sudo chmod +x gradlew

      # 8. बिना किसी एरर के फाइनल APK कंपाइल (Build) करना
      - name: Build Android Production APK
        run: |
          cd billing-app
          cordova build android --release

      # 9. तैयार हुआ असली APK ऐप डाउनलोड के लिए अपलोड करना
      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: Kalpvruksha-Billing-App-APK
          path: billing-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
