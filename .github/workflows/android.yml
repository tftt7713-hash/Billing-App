name: Build Zero-Error Android APK

on:
  push:
    branches:
      - main # जब भी आप कोड पुश करेंगे, ऐप अपने आप बनना शुरू हो जाएगा

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. गिटहब से आपका कोड उठाना (Path Error Fix)
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. JDK 17 को बिना किसी एरर के पक्का सेटअप करना
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. एन्ड्रोइड SDK टूल्स को रेडी करना
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. नोड जेएस (Node.js) को बैकएंड में चालू करना
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. Apache Cordova ऐप कनवर्टर को इंस्टॉल करना
      - name: Install Apache Cordova
        run: npm install -g cordova
        # 6. नया एन्ड्रोइड प्रोजेक्ट पाथ बनाना और अपनी index.html को उसमें फिट करना
      - name: Create Cordova Project and Setup Assets
        run: |
          cordova create billing-app com.kalpvruksha.billing BillingApp
          cd billing-app
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/index.html
          
      # 7. Gradle को कंप्यूटर सर्वर पर एक्जीक्यूट करने की पक्की परमिशन देना (Permission Error Fix)
      - name: Grant Execute Permission for Gradle
        run: |
          cd billing-app/platforms/android
          chmod +x gradlew

      # 8. बिना किसी एरर के फाइनल APK कंपाइल (Build) करना
      - name: Build Android Production APK
        run: |
          cd billing-app
          cordova build android --release

      # 9. तैयार हुए असली APK ऐप को गिटहब पर आपके लिए अपलोड करना
      - name: Upload and Release Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Billing-App-APK
          path: billing-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
