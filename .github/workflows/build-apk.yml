name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Remove old Android project
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare JPEG App Icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert assets/logo.jpeg -resize 1024x1024^ -gravity center -extent 1024x1024 assets/icon.png

      - name: Generate App Icons
        run: npx capacitor-assets generate --android

      - name: Add microphone permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Add biometric permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml

      - name: Add speech service visibility
        run: |
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Add print and backup bridge
        run: |
          APPDIR=android/app/src/main/java/com/tftt7713/hash/app
          mkdir -p $APPDIR
          rm -f $APPDIR/MainActivity.java $APPDIR/MainActivity.kt
          cat > $APPDIR/MainActivity.java <<'EOF'
          package com.tftt7713.hash.app;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.UriPermission;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.content.DialogInterface;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.Build;
          import android.os.CancellationSignal;
          import android.print.PrintDocumentAdapter;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.provider.DocumentsContract;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_PICK_FOLDER = 4711;
              private static final int REQ_SPEECH = 4712;
              private static final int REQ_AUDIO = 4713;
              private static final String PREFS = "backup_prefs";
              private static final String KEY_TREE = "tree_uri";

              private SpeechRecognizer sr;
              private boolean speechActive = false;
              private String speechLang = "hi-IN";
              private int speechErrCount = 0;
              private final Handler uiHandler = new Handler(Looper.getMainLooper());

              private void js(final String code) {
                  runOnUiThread(new Runnable() {
                      public void run() {
                          getBridge().getWebView().evaluateJavascript(code, null);
                      }
                  });
              }

              private Intent buildSpeechIntent() {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, speechLang);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                  i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                  i.putExtra("android.speech.extra.SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS", 6000L);
                  i.putExtra("android.speech.extra.SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS", 6000L);
                  i.putExtra("android.speech.extra.SPEECH_INPUT_MINIMUM_LENGTH_MILLIS", 15000L);
                  return i;
              }

              private void restartSpeech(long delayMs) {
                  if (!speechActive) return;
                  uiHandler.postDelayed(new Runnable() {
                      public void run() {
                          beginSpeech();
                      }
                  }, delayMs);
              }

              private void fatalSpeech(String msg) {
                  speechActive = false;
                  js("window.onVoiceError&&window.onVoiceError(" + JSONObject.quote(msg) + ",true)");
              }

              private void beginSpeech() {
                  if (!speechActive) return;
                  try {
                      if (sr == null) {
                          sr = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                          sr.setRecognitionListener(new RecognitionListener() {
                              public void onReadyForSpeech(Bundle b) {}
                              public void onBeginningOfSpeech() {}
                              public void onRmsChanged(float v) {}
                              public void onBufferReceived(byte[] b) {}
                              public void onEndOfSpeech() {}
                              public void onEvent(int t, Bundle b) {}

                              public void onPartialResults(Bundle b) {
                                  ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (r != null && r.size() > 0) {
                                      speechErrCount = 0;
                                      js("window.onVoicePartial&&window.onVoicePartial(" + JSONObject.quote(r.get(0)) + ")");
                                  }
                              }

                              public void onResults(Bundle b) {
                                  ArrayList<String> r = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (r != null && r.size() > 0) {
                                      speechErrCount = 0;
                                      js("window.onVoiceFinal&&window.onVoiceFinal(" + JSONObject.quote(r.get(0)) + ")");
                                  }
                                  restartSpeech(250);
                              }

                              public void onError(int code) {
                                  if (!speechActive) return;
                                  js("window.onVoicePartial&&window.onVoicePartial('')");
                                  if (code == SpeechRecognizer.ERROR_NO_MATCH || code == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) {
                                      restartSpeech(200);
                                      return;
                                  }
                                  if (code == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                      fatalSpeech("mic permission");
                                      return;
                                  }
                                  speechErrCount++;
                                  if (speechErrCount > 6) {
                                      fatalSpeech("error " + code);
                                      return;
                                  }
                                  try { sr.cancel(); } catch (Exception e) {}
                                  restartSpeech(code == SpeechRecognizer.ERROR_RECOGNIZER_BUSY ? 700 : 1000);
                              }
                          });
                      }
                      sr.startListening(buildSpeechIntent());
                  } catch (Exception e) {
                      fatalSpeech(String.valueOf(e));
                  }
              }

              public class PrintBridge {
                  @JavascriptInterface
                  public void print(final String title) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              WebView wv = getBridge().getWebView();
                              PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              String name = (title == null || title.isEmpty()) ? "Invoice" : title;
                              pm.print(name, wv.createPrintDocumentAdapter(name),
                                  new PrintAttributes.Builder()
                                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                      .setResolution(new PrintAttributes.Resolution("pdf", "pdf", 300, 300))
                                      .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                                      .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                      .build());
                          }
                      });
                  }
              }

              public class SpeechBridge {
                  @JavascriptInterface
                  public void startContinuous(final String lang) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              speechLang = (lang == null || lang.isEmpty()) ? "hi-IN" : lang;
                              if (!SpeechRecognizer.isRecognitionAvailable(MainActivity.this)) {
                                  fatalSpeech("speech service unavailable");
                                  return;
                              }
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_AUDIO);
                                  return;
                              }
                              speechActive = true;
                              speechErrCount = 0;
                              beginSpeech();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopContinuous() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              speechActive = false;
                              uiHandler.removeCallbacksAndMessages(null);
                              if (sr != null) {
                                  try { sr.stopListening(); } catch (Exception e) {}
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void listen(final String lang) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                                  i.putExtra(RecognizerIntent.EXTRA_PROMPT, "बोलिए...");
                                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                                  MainActivity.this.startActivityForResult(i, REQ_SPEECH);
                              } catch (Exception e) {
                                  js("window.onSpeechError&&window.onSpeechError(" + JSONObject.quote(String.valueOf(e)) + ")");
                              }
                          }
                      });
                  }
              }

              public class ShareBridge {
                  @JavascriptInterface
                  public void sendPdf(final String name, final String phone) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  File dir = new File(getCacheDir(), "bills");
                                  dir.mkdirs();
                                  String safe = (name == null || name.isEmpty()) ? "Bill" : name.replaceAll("[^A-Za-z0-9_\\-]", "_");
                                  final File f = new File(dir, safe + ".pdf");
                                  WebView wv = getBridge().getWebView();
                                  PrintDocumentAdapter ad = wv.createPrintDocumentAdapter(safe);
                                  PrintAttributes pa = new PrintAttributes.Builder()
                                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                      .setResolution(new PrintAttributes.Resolution("pdf", "pdf", 300, 300))
                                      .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                                      .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                      .build();
                                  final String ph = phone;
                                  new android.print.PdfPrint(pa).write(ad, f, new android.print.PdfPrint.Done() {
                                      public void onDone(final boolean ok) {
                                          runOnUiThread(new Runnable() {
                                              public void run() {
                                                  launchWhatsApp(f, ph, ok);
                                              }
                                          });
                                      }
                                  });
                              } catch (Throwable t) {
                                  js("window.onShareResult&&window.onShareResult(false," + JSONObject.quote(String.valueOf(t)) + ")");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openUrl(final String url) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception e) {}
                          }
                      });
                  }
              }

              private void launchWhatsApp(File f, String phone, boolean ok) {
                  try {
                      if (!ok || !f.exists() || f.length() < 1500) {
                          js("window.onShareResult&&window.onShareResult(false,'PDF नहीं बन पाई')");
                          return;
                      }
                      Uri uri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", f);
                      String[] pkgs = new String[]{"com.whatsapp", "com.whatsapp.w4b"};
                      boolean started = false;
                      for (String p : pkgs) {
                          try {
                              Intent i = new Intent(Intent.ACTION_SEND);
                              i.setType("application/pdf");
                              i.putExtra(Intent.EXTRA_STREAM, uri);
                              i.putExtra("jid", phone + "@s.whatsapp.net");
                              i.setPackage(p);
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(i);
                              started = true;
                              break;
                          } catch (Exception e) {}
                      }
                      if (started) {
                          js("window.onShareResult&&window.onShareResult(true,'ok')");
                      } else {
                          js("window.onShareResult&&window.onShareResult(false,'WhatsApp नहीं मिला')");
                      }
                  } catch (Throwable t) {
                      js("window.onShareResult&&window.onShareResult(false," + JSONObject.quote(String.valueOf(t)) + ")");
                  }
              }

              public class BioBridge {
                  @JavascriptInterface
                  public boolean available() {
                      try {
                          if (Build.VERSION.SDK_INT < 30) return false;
                          BiometricManager bm = (BiometricManager) getSystemService(Context.BIOMETRIC_SERVICE);
                          if (bm == null) return false;
                          int a = BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK;
                          return bm.canAuthenticate(a) == BiometricManager.BIOMETRIC_SUCCESS;
                      } catch (Throwable t) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void authenticate() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  if (Build.VERSION.SDK_INT < 30) {
                                      js("window.onBioResult&&window.onBioResult(false,'unsupported')");
                                      return;
                                  }
                                  int a = BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK;
                                  BiometricPrompt.Builder b = new BiometricPrompt.Builder(MainActivity.this)
                                      .setTitle("ऐप खोलें")
                                      .setSubtitle("फ़िंगरप्रिंट या फेस से पुष्टि करें")
                                      .setAllowedAuthenticators(a)
                                      .setNegativeButton("PIN डालें", getMainExecutor(), new DialogInterface.OnClickListener() {
                                          public void onClick(DialogInterface d, int w) {
                                              js("window.onBioResult&&window.onBioResult(false,'cancel')");
                                          }
                                      });
                                  BiometricPrompt bp = b.build();
                                  bp.authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {
                                      @Override
                                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                                          js("window.onBioResult&&window.onBioResult(true,'ok')");
                                      }

                                      @Override
                                      public void onAuthenticationError(int code, CharSequence msg) {
                                          js("window.onBioResult&&window.onBioResult(false," + JSONObject.quote(String.valueOf(msg)) + ")");
                                      }
                                  });
                              } catch (Throwable t) {
                                  js("window.onBioResult&&window.onBioResult(false," + JSONObject.quote(String.valueOf(t)) + ")");
                              }
                          }
                      });
                  }
              }

              public class BackupBridge {
                  @JavascriptInterface
                  public void pickFolder() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                                  | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                                  | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                              MainActivity.this.startActivityForResult(i, REQ_PICK_FOLDER);
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean hasFolder() {
                      String s = getSharedPreferences(PREFS, MODE_PRIVATE).getString(KEY_TREE, null);
                      if (s == null) return false;
                      for (UriPermission p : getContentResolver().getPersistedUriPermissions()) {
                          if (p.getUri().toString().equals(s) && p.isWritePermission()) return true;
                      }
                      return false;
                  }

                  @JavascriptInterface
                  public String saveBills(String json) {
                      try {
                          String s = getSharedPreferences(PREFS, MODE_PRIVATE).getString(KEY_TREE, null);
                          if (s == null) return "NOFOLDER";
                          Uri tree = Uri.parse(s);
                          String treeDocId = DocumentsContract.getTreeDocumentId(tree);
                          Uri parent = DocumentsContract.buildDocumentUriUsingTree(tree, treeDocId);
                          Uri children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId);

                          HashMap<String, Uri> existing = new HashMap<String, Uri>();
                          Cursor c = getContentResolver().query(children, new String[]{
                              DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME}, null, null, null);
                          if (c != null) {
                              while (c.moveToNext()) {
                                  existing.put(c.getString(1),
                                      DocumentsContract.buildDocumentUriUsingTree(tree, c.getString(0)));
                              }
                              c.close();
                          }

                          JSONArray arr = new JSONArray(json);
                          int count = 0;
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject bill = arr.optJSONObject(i);
                              if (bill == null) continue;
                              String id = bill.has("id") ? bill.get("id").toString() : (System.currentTimeMillis() + "_" + i);
                              String name = "bill_" + id + ".json";
                              Uri target = existing.get(name);
                              if (target == null) {
                                  target = DocumentsContract.createDocument(getContentResolver(), parent, "application/json", name);
                              }
                              if (target == null) continue;
                              OutputStream os = getContentResolver().openOutputStream(target, "wt");
                              if (os == null) continue;
                              os.write(bill.toString(2).getBytes("UTF-8"));
                              os.close();
                              count++;
                          }
                          String folder = tree.getLastPathSegment();
                          if (folder == null) folder = "Selected folder";
                          return "OK|" + count + "|" + folder;
                      } catch (Exception e) {
                          return "ERROR|" + e.getMessage();
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_AUDIO) {
                      if (grantResults != null && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          speechActive = true;
                          speechErrCount = 0;
                          beginSpeech();
                      } else {
                          fatalSpeech("mic permission denied");
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_SPEECH) {
                      if (resultCode == RESULT_OK && data != null) {
                          ArrayList<String> r = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                          if (r != null && r.size() > 0) {
                              js("window.onSpeechResult&&window.onSpeechResult(" + JSONObject.quote(r.get(0)) + ")");
                              return;
                          }
                      }
                      js("window.onSpeechError&&window.onSpeechError(" + JSONObject.quote("no result, code=" + resultCode) + ")");
                      return;
                  }
                  if (requestCode == REQ_PICK_FOLDER) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          Uri tree = data.getData();
                          try {
                              getContentResolver().takePersistableUriPermission(tree,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                          } catch (Exception e) {}
                          getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(KEY_TREE, tree.toString()).apply();
                          js("window.onBackupFolderPicked&&window.onBackupFolderPicked(true)");
                      } else {
                          js("window.onBackupFolderPicked&&window.onBackupFolderPicked(false)");
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "AndroidPrint");
                  getBridge().getWebView().addJavascriptInterface(new BackupBridge(), "AndroidBackup");
                  getBridge().getWebView().addJavascriptInterface(new SpeechBridge(), "AndroidSpeech");
                  getBridge().getWebView().addJavascriptInterface(new ShareBridge(), "AndroidShare");
                  getBridge().getWebView().addJavascriptInterface(new BioBridge(), "AndroidBio");
              }

              @Override
              public void onDestroy() {
                  speechActive = false;
                  uiHandler.removeCallbacksAndMessages(null);
                  if (sr != null) {
                      try { sr.destroy(); } catch (Exception e) {}
                      sr = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Add PDF helper
        run: |
          mkdir -p android/app/src/main/java/android/print
          cat > android/app/src/main/java/android/print/PdfPrint.java <<'EOF2'
          package android.print;

          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import java.io.File;

          public class PdfPrint {
              public interface Done {
                  void onDone(boolean ok);
              }

              private final PrintAttributes attrs;

              public PdfPrint(PrintAttributes a) {
                  attrs = a;
              }

              public void write(final PrintDocumentAdapter adapter, final File file, final Done cb) {
                  adapter.onLayout(null, attrs, new CancellationSignal(), new PrintDocumentAdapter.LayoutResultCallback() {
                      @Override
                      public void onLayoutFinished(PrintDocumentInfo info, boolean changed) {
                          try {
                              ParcelFileDescriptor fd = ParcelFileDescriptor.open(file,
                                  ParcelFileDescriptor.MODE_READ_WRITE
                                  | ParcelFileDescriptor.MODE_CREATE
                                  | ParcelFileDescriptor.MODE_TRUNCATE);
                              adapter.onWrite(new PageRange[]{PageRange.ALL_PAGES}, fd, new CancellationSignal(),
                                  new PrintDocumentAdapter.WriteResultCallback() {
                                      @Override
                                      public void onWriteFinished(PageRange[] pages) {
                                          super.onWriteFinished(pages);
                                          cb.onDone(true);
                                      }

                                      @Override
                                      public void onWriteFailed(CharSequence error) {
                                          super.onWriteFailed(error);
                                          cb.onDone(false);
                                      }
                                  });
                          } catch (Exception e) {
                              cb.onDone(false);
                          }
                      }

                      @Override
                      public void onLayoutFailed(CharSequence error) {
                          super.onLayoutFailed(error);
                          cb.onDone(false);
                      }
                  }, null);
              }
          }
          EOF2

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
