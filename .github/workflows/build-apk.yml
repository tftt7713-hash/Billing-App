name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Remove old Android project
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml

      - name: Add speech service visibility
        run: |
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Add print bridge
        run: |
          APPDIR=android/app/src/main/java/com/tftt7713/hash/app
          mkdir -p $APPDIR
          rm -f $APPDIR/MainActivity.java $APPDIR/MainActivity.kt
          cat > $APPDIR/MainActivity.java <<'EOF'
          package com.tftt7713.hash.app;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              public class PrintBridge {
                  @JavascriptInterface
                  public void print(final String title) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              WebView wv = getBridge().getWebView();
                              PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                              String name = (title == null || title.isEmpty()) ? "Invoice" : title;
                              pm.print(name, wv.createPrintDocumentAdapter(name),
                                  new PrintAttributes.Builder()
                                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                      .build());
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "AndroidPrint");
              }
          }
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
